{% extends 'base.html' %}{% block title %}{{ page_title }} | BusBuddy{% endblock %}{% block page_heading %}{{ page_title }}{% endblock %}{% block content %}<div class="welcome-row"><div><h2>{{ page_title }}</h2><p>Enter product details. SKU must be unique.</p></div><a class="btn btn-light" href="{{ url_for('products') }}">← Back to products</a></div><section class="panel form-panel"><form method="post" class="form-grid"><label>Product name *<input name="name" required maxlength="100" value="{{ request.form.get('name', product.name if product else '') }}" placeholder="e.g. Student Travel Card"></label><label>SKU / Item code *<input name="sku" required maxlength="30" value="{{ request.form.get('sku', product.sku if product else '') }}" placeholder="e.g. BB-007"></label><label>Category<input name="category" maxlength="60" value="{{ request.form.get('category', product.category if product else 'General') }}" placeholder="e.g. Cards"></label><label>Unit price (₹) *<input type="number" name="price" min="0" step="0.01" required value="{{ request.form.get('price', product.price if product else '') }}"></label><label>Current stock *<input type="number" name="stock" min="0" step="1" required value="{{ request.form.get('stock', product.stock if product else '0') }}"></label><label>Low-stock threshold *<input type="number" name="low_stock_threshold" min="0" step="1" required value="{{ request.form.get('low_stock_threshold', product.low_stock_threshold if product else '5') }}"></label><div class="form-actions"><button class="btn btn-primary" type="submit">{{ 'Save changes' if product else 'Add product' }}</button><a class="btn btn-light" href="{{ url_for('products') }}">Cancel</a></div></form></section>{% endblock %}
